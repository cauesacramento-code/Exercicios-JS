    <title>Exercicio15</title>
    <script> 
    var km= Number(prompt("Digite a quantidade de km percorridos:"));
     var litros= Number(prompt("Digite o volume consumido:"));

     function calcularMedia(km, litros){
        var media= km/litros;
        return media;
     }
     var resultado= calcularMedia(km, litros);

     document.write(Math.round(resultado));
    </script>
