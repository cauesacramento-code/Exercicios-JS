<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Exercício evento</title>
</head>
<body>
        <div>
            <h2>Evento onkeyup</h2>

            <label for="texto" class="form-label">Digite alguma coisa:</label>
            <input
                type="text"
                id="texto"
                class="form-control"
                placeholder="Digite aqui..."
                onkeyup="teclaPressionada()">
        </div>
    </div>

    <script>
        function teclaPressionada() {
            console.log("Uma tecla foi acionada!");
        }
    </script>

   

</body>
</html>
