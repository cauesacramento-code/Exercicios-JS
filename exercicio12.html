<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio12</title>
    <script>
        var a =Number(prompt('Digite o valor de A'));
        var b =Number(prompt('Digite o valor de B'));       
        var c =Number(prompt('Digite o valor de C'));
        var delta = (b*b - 4*a*c);
        var x1 = (-b + Math.sqrt(delta)) / (2*a);
        var x2 = (-b - Math.sqrt(delta)) / (2*a);
        document.write('x1 = ' + x1.toFixed(3) + '<br>');
        document.write('x2 = ' + x2.toFixed(3) + '<br>');
    </script>
</head>
<body>

</body>
</html>
