<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio09
    </title>
    <script>
        var meses = prompt('Digite o número de dias do mês (de 28 a 31):');
        switch (meses) {
            case '28':
                document.write('Fevereiro');
                break;
            case '30':
                document.write('Abril, Junho, Setembro ou Novembro');
                break;
            case '31':
                document.write('Janeiro, Março, Maio, Julho, Agosto, Outubro ou Dezembro');
                break;
                default:
                document.write('Número de dias inválido');
        }
    </script>
</head>

</body>
</html>
