<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 06</title>
    <script> 
        var idadeB = prompt('Qual sua Idade?')

        if (idadeB < 0 || isNaN(idadeB)) {
            alert('Resposta inválida. Tente novamente');
        }

        if (idadeB >= 0 && idadeB < 15) {
            alert('Criança, pois sua idade é: ' + idadeB);
        }
        
        else if (idadeB >= 15 && idadeB < 30) {
            alert('Jovem, pois sua idade é: ' + idadeB);
        }
        
        else if (idadeB >= 30 && idadeB < 60) {
            alert('Adulto, pois sua idade é: ' + idadeB);
        }
        
        else if (idadeB >= 60 && idadeB < 100) {
            alert('Idoso, pois sua idade é: ' + idadeB);
        }
        
    </script>
</head>
<body>
    
</body>
</html>
