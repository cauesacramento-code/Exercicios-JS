<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio09
    </title>
    <script>
        var conceito = prompt('Digite a nota da escola (letra maiúscula): de A a F');
        switch (conceito) {
            case 'A':
                document.write('Excelente');
                break;
            case 'B':
                document.write('Bom');
                break;
            case 'C':
                document.write('Regular');
                break;
            case 'D':
                document.write('Ruim');
                break;
                case 'E':
                document.write('Péssimo');
                break;
            case 'F':
                document.write('Reprovado');
                break;
                default:
                document.write('Nota inválida');
        }
    </script>
</head>
<body>
    
</body>
</html>
