<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soma com FOR</title>
</head>
<body>
    <script>
        const precos = [10.2, 23.90, 99.99, 25.50];
        let total = 0;

        for (let i = 0; i < precos.length; i++) {
            total += precos[i];
        }

        alert(total.toFixed(2));
    </script>
</body>
</html>
