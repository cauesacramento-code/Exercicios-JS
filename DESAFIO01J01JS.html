<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>desafio 01 real</title>
    <script>
        var nome = prompt('Qual seu nome?');
        var salario = Number(prompt('Qual seu salário?'));
        var venda = Number(prompt('Qual foi sua venda?'));
        var comissão = 0;
      comissão = venda * 0.025;
      salario= salario + comissão;
      document.write('<h1>Olá ' + nome + ', seu salário é de R$' + salario + ' esse mês.</h1>' );
      
    </script>
</head>

</body>
</html>
