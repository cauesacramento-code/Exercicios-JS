<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Função ex13</title>
    <script>

        function verificarParOuImpar(x) {
            if ((x % 2) == 0) {
              return 'PAR';
            } else {
                return 'IMPAR';
            }
        }
        var z = verificarParOuImpar(Number(prompt("Digite um número:")));
        document.write(z);

    </script>
