<!DOCTYPE html>
<html lang="en">
<head>

            </div>
            <div class="col marcador">
                Artigo
            </div>
        </div>
        <div class="row">
            <div class="col marcador">
                Propaganda 1
            </div>
            <div class="col marcador">
                Propaganda 2
            </div>
            <div class="col marcador">

            </div>

        <div class="row">
            <div class="col marcador">
                Área 1
            </div>
                <div class="col marcador">
